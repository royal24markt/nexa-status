# Upptime configuration for the public status page status.nexa-markt.de
# ------------------------------------------------------------------------------------------------------------------
# TEMPLATE — this file is copied into the separate PUBLIC repository `royal24markt/nexa-status` on server day
# (docs/infrastructure/status-page.md §5). It lives here so it is reviewed like code. It contains NO secrets:
# notification credentials are GitHub Actions *secrets* of the public repo, entered by the owner in the GitHub UI.
#
# Only public facts are in here: the three portal host names (already public through DNS/TLS certificates) and
# the two probe paths, whose bodies carry no host names, versions or error texts (packages/web/src/server/health.ts).
# Never add: the server IP, internal service names, the private repo name, e-mail passwords, tokens.
#
# Keys verified against https://upptime.js.org/docs/configuration/ (2026-11-11).

owner: royal24markt # GitHub account that owns the public status repo
repo: nexa-status # PUBLIC repo (GitHub Pages + Actions are free only for public repos)

# The repo shows Upptime's own README; keep GitHub from rewriting description/topics/homepage of the repo
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

# Who gets assigned to the automatic "down" issues → GitHub notification e-mail to this account (no secret needed)
assignees:
  - royal24markt

# Every 5 minutes is the fastest GitHub allows for scheduled workflows. Runs are best-effort (can be delayed).
workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"

commitMessages:
  commitAuthorName: "Nexa Status Bot"
  commitAuthorEmail: "41898282+github-actions[bot]@users.noreply.github.com"

# ------------------------------------------------------------------------------------------------------------------
# Monitors. "Bereit" (= /api/ready) is what users feel: the portal answers AND reaches its database (503 otherwise).
# "Erreichbar" (= /api/health) only says the process answers — it separates "app down" from "database down".
# slug = stable id used in maintenance issues (`expectedDown: haendler-bereit`) and in the repo's history files.
# ------------------------------------------------------------------------------------------------------------------
sites:
  - name: Händler-Portal
    slug: haendler-bereit
    url: https://haendler.nexa-markt.de/api/ready
    expectedStatusCodes: [200]
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"status":"ready"'
  - name: Lieferanten-Portal
    slug: lieferanten-bereit
    url: https://lieferanten.nexa-markt.de/api/ready
    expectedStatusCodes: [200]
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"status":"ready"'
  - name: Verwaltung
    slug: verwaltung-bereit
    url: https://verwaltung.nexa-markt.de/api/ready
    expectedStatusCodes: [200]
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"status":"ready"'
  - name: Händler-Portal (Webserver)
    slug: haendler-erreichbar
    url: https://haendler.nexa-markt.de/api/health
    expectedStatusCodes: [200]
    maxResponseTime: 5000
  - name: Lieferanten-Portal (Webserver)
    slug: lieferanten-erreichbar
    url: https://lieferanten.nexa-markt.de/api/health
    expectedStatusCodes: [200]
    maxResponseTime: 5000
  - name: Verwaltung (Webserver)
    slug: verwaltung-erreichbar
    url: https://verwaltung.nexa-markt.de/api/health
    expectedStatusCodes: [200]
    maxResponseTime: 5000
# TLS certificate expiry is NOT an Upptime feature: workflows/tls-expiry.yml (same public repo) checks it daily.

# ------------------------------------------------------------------------------------------------------------------
# Status website (GitHub Pages). German interface; the intro is bilingual German/Polish because the page has one
# interface language. Incident posts are written in both languages (infra/status/templates/).
# ------------------------------------------------------------------------------------------------------------------
status-website:
  cname: status.nexa-markt.de # needs DNS: CNAME status → royal24markt.github.io (status-page.md §4)
  name: Nexa AI – Systemstatus
  # logoUrl: https://status.nexa-markt.de/logo.svg  # optional: add the logo file to the public repo's assets/
  introTitle: "Systemstatus / Status systemu"
  introMessage: >-
    Aktueller Zustand der Nexa-AI-Portale für Händler und Lieferanten. Diese Seite läuft unabhängig von unseren
    Servern und bleibt auch bei einem Ausfall erreichbar. Fragen: info@nexa-markt.de<br><br>
    Aktualny stan portali Nexa AI dla sprzedawców i dostawców. Ta strona działa niezależnie od naszych serwerów
    i pozostaje dostępna również podczas awarii. Pytania: info@nexa-markt.de
  theme: light
  navbar:
    - title: Händler-Portal
      href: https://haendler.nexa-markt.de
    - title: Lieferanten-Portal / Portal dostawcy
      href: https://lieferanten.nexa-markt.de
    - title: Kontakt
      href: mailto:info@nexa-markt.de

