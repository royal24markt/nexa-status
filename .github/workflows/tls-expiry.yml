# TEMPLATE for the PUBLIC status repo royal24markt/nexa-status → copy to .github/workflows/tls-expiry.yml there,
# together with infra/status/scripts/check-tls-expiry.sh → scripts/check-tls-expiry.sh.
# Daily TLS expiry check of the three portals from a GitHub runner (outside the OVH server). Upptime itself only notices a
# certificate once it is already broken; Caddy renews at ~30 days left, so < 14 days means renewal is failing.
# A failed scheduled run e-mails the repo owner (GitHub default). Optional ntfy push via the NTFY_URL repo secret.
# Free: standard GitHub-hosted runners are free in public repositories.
name: TLS-Ablauf prüfen
on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Zertifikate prüfen
        env:
          WARN_DAYS: "14"
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: bash scripts/check-tls-expiry.sh
